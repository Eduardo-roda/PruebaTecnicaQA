serenity {
  project.name = "Prueba Tecnica QA Automatizado Senior"
  take.screenshots = FOR_FAILURES
  restart.browser.each.scenario = story
  console.colors = true
}

webdriver {
  driver = ${?webdriver.driver}
  driver = "chrome"
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["headless=new", "disable-gpu", "window-size=1920,1080", "no-sandbox", "disable-dev-shm-usage"]
    }
  }
}

headless.mode = true
headless.mode = ${?headless.mode}

# ============ URLs base, sobreescribibles por linea de comandos con -D ============
web {
  base {
    url = "https://www.selenium.dev"
  }
}
webdriver.base.url = "https://www.selenium.dev"
webdriver.base.url = ${?web.base.url}

api {
  base {
    url = "https://reqres.in"
  }
}

# ============ Timeouts ============
webdriver.timeouts.implicitlywait = 5000
webdriver.wait.for.timeout = 10000

serenity.take.screenshots = FOR_FAILURES
serenity.reports.show.step.details = true

tag_failures = true

environments {
  default {
    web.base.url = "https://www.selenium.dev"
    api.base.url = "https://reqres.in"
  }
  staging {
    web.base.url = "https://www.selenium.dev"
    api.base.url = "https://reqres.in"
  }
}
